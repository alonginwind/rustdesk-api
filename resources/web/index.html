<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/webclient/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="rustdesk-webclient">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>rustdesk-webclient</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Vendored tweetnacl-js (github.com/dchest/tweetnacl-js, Unlicense); the web client has no
       package step. Keep it above load_bridge.js: a classic script runs before a module one,
       which is what makes window.nacl available while the bridge is being evaluated. -->
  <script src="tweetnacl.min.js"></script>
  <!-- Vendored fzstd (github.com/101arrowz/fzstd, MIT), the pure-JS zstd decoder. It is only the
       fallback for when the wasm bridge is unavailable; the same classic-script rule applies, so
       window.fzstd exists while load_bridge.js is evaluated. -->
  <script src="fzstd.js"></script>
  <script type="module" src="load_bridge.js"></script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
